services:
  mongo:
    image: mongo:latest
    container_name: spotify_mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  redis:
    image: redis:alpine
    container_name: spotify_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: worker/dockerfile
    container_name: spotify_worker
    environment:
      - MONGO_URL=mongodb://mongo:27017/spotify_clone
      - MONGO_DB_NAME=spotify_clone
    depends_on:
      mongo:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  backend:
    build: .
    container_name: spotify_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/spotify_clone
      - MONGO_DB_NAME=spotify_clone
      - REDIS_HOST=redis
      - SECRET_KEY=change-me-in-production
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  mongo_data:
